name: Daily Health Monitor

on:
  schedule:
    - cron: '0 7 * * *' # Daily at 7:00 AM UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run health checks and notify Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          REPORT=""
          ALL_PASS=true

          # CHECK 1 — Production site
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.convertraiq.com)
          if [ "$STATUS" = "200" ]; then
            REPORT="$REPORT✅ Production site — UP ($STATUS)"
          else
            REPORT="$REPORT❌ Production site — DOWN ($STATUS)"
            ALL_PASS=false
          fi

          # CHECK 2 — Supabase
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/")
          if [ "$STATUS" = "200" ]; then
            REPORT="$REPORT
          ✅ Supabase — Connected"
          else
            REPORT="$REPORT
          ❌ Supabase — Unreachable ($STATUS)"
            ALL_PASS=false
          fi

          # CHECK 3 — Sentry new errors (last 24h)
          SENTRY_RESPONSE=$(curl -s -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/spire-enterprises-pty-ltd/javascript-react/issues/?query=is:unresolved+firstSeen:-24h&limit=50")
          ERROR_COUNT=$(echo "$SENTRY_RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
          if [ "$ERROR_COUNT" = "0" ]; then
            REPORT="$REPORT
          ✅ Sentry — No new errors"
          elif [ "$ERROR_COUNT" -le 3 ] 2>/dev/null; then
            REPORT="$REPORT
          ⚠️ Sentry — $ERROR_COUNT new error(s) (last 24h)"
          else
            REPORT="$REPORT
          ❌ Sentry — $ERROR_COUNT new errors (last 24h)"
            ALL_PASS=false
          fi

          # CHECK 4 — Expired client credentials
          CREDS_RESPONSE=$(curl -s -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/organization_credentials?select=organization_id,status,token_expires_at&status=eq.expired")
          EXPIRED_COUNT=$(echo "$CREDS_RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
          if [ "$EXPIRED_COUNT" = "0" ]; then
            REPORT="$REPORT
          ✅ Client credentials — All valid"
          else
            REPORT="$REPORT
          ❌ Client credentials — $EXPIRED_COUNT expired"
            ALL_PASS=false
          fi

          # CHECK 5 — Stripe API
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$STRIPE_SECRET_KEY:" https://api.stripe.com/v1/balance)
          if [ "$STATUS" = "200" ]; then
            REPORT="$REPORT
          ✅ Stripe — Connected"
          else
            REPORT="$REPORT
          ❌ Stripe — Unreachable ($STATUS)"
            ALL_PASS=false
          fi

          # Build full message
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          MESSAGE="*Convertra Daily Health Report*

          $REPORT

          _Report generated at $TIMESTAMP_"

          # Send to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=-1003806442463" \
            -d "message_thread_id=145" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MESSAGE"

          # Fail the workflow if any check failed
          if [ "$ALL_PASS" = false ]; then
            echo "::warning::One or more health checks failed"
          fi
